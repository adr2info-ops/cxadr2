<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Caixa Diário - ADR2</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #2563eb;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --subtext: #475569;
            --success: #16a34a;
            --border: #cbd5e1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 95px; }

        header { background: var(--primary); color: white; padding: 12px 16px; text-align: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 6px rgba(0,0,0,0.12); }
        header h1 { font-size: 1.05rem; font-weight: 700; letter-spacing: 0.5px; }

        .container { max-width: 420px; margin: 0 auto; padding: 10px; }

        .card-date { background: var(--card-bg); padding: 10px 14px; border-radius: 10px; margin-bottom: 10px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .card-date label { font-weight: 700; font-size: 0.8rem; color: var(--subtext); }
        .card-date input { border: 1px solid var(--border); background: #f1f5f9; padding: 6px 10px; border-radius: 6px; font-size: 0.9rem; font-weight: 600; color: var(--text); outline: none; }

        .card { background: var(--card-bg); border-radius: 12px; padding: 12px; margin-bottom: 10px; border: 1px solid var(--border); box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
        .card-title { font-size: 0.88rem; font-weight: 700; color: var(--primary); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f5f9; padding-bottom: 6px; }
        .card-title span.subtotal-badge { background: #eff6ff; color: var(--primary-light); font-size: 0.8rem; padding: 3px 8px; border-radius: 6px; font-weight: 700; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .field { display: flex; flex-direction: column; }
        .field label { font-size: 0.7rem; font-weight: 700; color: var(--subtext); margin-bottom: 3px; text-transform: uppercase; }
        .field input { width: 100%; padding: 8px 10px; border: 1px solid var(--border); background: #f8fafc; border-radius: 6px; font-size: 0.95rem; font-weight: 700; text-align: right; color: var(--text); outline: none; -webkit-appearance: none; }
        .field input:focus { border-color: var(--primary-light); background: #fff; box-shadow: 0 0 0 2px rgba(37,99,235,0.15); }

        .summary-card { background: #f1f5f9; border: 1px dashed #cbd5e1; border-radius: 10px; padding: 10px; margin-bottom: 12px; }
        .summary-title { font-size: 0.75rem; font-weight: 700; color: var(--subtext); text-transform: uppercase; margin-bottom: 6px; text-align: center; }
        .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; text-align: center; }
        .summary-item { background: #fff; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); }
        .summary-item label { font-size: 0.65rem; color: var(--subtext); font-weight: 700; display: block; }
        .summary-item span { font-size: 0.85rem; font-weight: 700; color: var(--text); }

        .footer-action { position: fixed; bottom: 0; left: 0; right: 0; background: #ffffff; border-top: 1px solid var(--border); padding: 10px 14px; box-shadow: 0 -3px 10px rgba(0,0,0,0.08); z-index: 100; }
        .footer-container { max-width: 420px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        
        .total-display { display: flex; flex-direction: column; }
        .total-display label { font-size: 0.65rem; font-weight: 700; color: var(--subtext); text-transform: uppercase; }
        .total-display span { font-size: 1.2rem; font-weight: 800; color: var(--success); }

        .btn-salvar { background: var(--success); color: white; border: none; padding: 10px 18px; border-radius: 8px; font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: background 0.2s; -webkit-tap-highlight-color: transparent; }
        .btn-salvar:active { background: #15803d; }
    </style>
</head>
<body>

    <header>
        <h1>Caixa Diário</h1>
    </header>

    <div class="container">
        <!-- Data -->
        <div class="card-date">
            <label for="data_caixa">DATA DO CAIXA</label>
            <input type="date" id="data_caixa" onchange="carregarData()">
        </div>

        <!-- CLIPP -->
        <div class="card">
            <div class="card-title">
                <span>1. CLIPP</span>
                <span class="subtotal-badge" id="sub_clipp">R$ 0,00</span>
            </div>
            <div class="grid">
                <div class="field"><label>NP</label><input type="number" step="0.01" id="clipp_np" placeholder="0,00" oninput="calcular()"></div>
                <div class="field"><label>PIX</label><input type="number" step="0.01" id="clipp_pix" placeholder="0,00" oninput="calcular()"></div>
                <div class="field"><label>ESPÉCIE</label><input type="number" step="0.01" id="clipp_especie" placeholder="0,00" oninput="calcular()"></div>
                <div class="field"><label>CARTÃO</label><input type="number" step="0.01" id="clipp_cartao" placeholder="0,00" oninput="calcular()"></div>
            </div>
        </div>

        <!-- OSRECARGAS -->
        <div class="card">
            <div class="card-title">
                <span>2. OSRECARGAS</span>
                <span class="subtotal-badge" id="sub_os">R$ 0,00</span>
            </div>
            <div class="grid">
                <div class="field"><label>NP</label><input type="number" step="0.01" id="os_np" placeholder="0,00" oninput="calcular()"></div>
                <div class="field"><label>PIX</label><input type="number" step="0.01" id="os_pix" placeholder="0,00" oninput="calcular()"></div>
                <div class="field"><label>ESPÉCIE</label><input type="number" step="0.01" id="os_especie" placeholder="0,00" oninput="calcular()"></div>
                <div class="field"><label>CARTÃO</label><input type="number" step="0.01" id="os_cartao" placeholder="0,00" oninput="calcular()"></div>
            </div>
        </div>

        <!-- SHOFICINA -->
        <div class="card">
            <div class="card-title">
                <span>3. SHOFICINA</span>
                <span class="subtotal-badge" id="sub_sh">R$ 0,00</span>
            </div>
            <div class="grid">
                <div class="field"><label>NP</label><input type="number" step="0.01" id="sh_np" placeholder="0,00" oninput="calcular()"></div>
                <div class="field"><label>PIX</label><input type="number" step="0.01" id="sh_pix" placeholder="0,00" oninput="calcular()"></div>
                <div class="field"><label>ESPÉCIE</label><input type="number" step="0.01" id="sh_especie" placeholder="0,00" oninput="calcular()"></div>
                <div class="field"><label>CARTÃO</label><input type="number" step="0.01" id="sh_cartao" placeholder="0,00" oninput="calcular()"></div>
            </div>
        </div>

        <!-- RESUMO POR FORMA DE PAGAMENTO -->
        <div class="summary-card">
            <div class="summary-title">Consolidado por Meio de Pagamento</div>
            <div class="summary-grid">
                <div class="summary-item"><label>TOTAL NP</label><span id="tot_np">R$ 0,00</span></div>
                <div class="summary-item"><label>TOTAL PIX</label><span id="tot_pix">R$ 0,00</span></div>
                <div class="summary-item"><label>TOTAL ESPÉCIE</label><span id="tot_especie">R$ 0,00</span></div>
                <div class="summary-item"><label>TOTAL CARTÃO</label><span id="tot_cartao">R$ 0,00</span></div>
            </div>
        </div>
    </div>

    <!-- RODAPÉ FIXO -->
    <div class="footer-action">
        <div class="footer-container">
            <div class="total-display">
                <label>TOTAL GERAL DO DIA</label>
                <span id="total_geral">R$ 0,00</span>
            </div>
            <button class="btn-salvar" onclick="salvarData()">SALVAR CAIXA</button>
        </div>
    </div>

<script>
    const campos = [
        'clipp_np', 'clipp_pix', 'clipp_especie', 'clipp_cartao',
        'os_np', 'os_pix', 'os_especie', 'os_cartao',
        'sh_np', 'sh_pix', 'sh_especie', 'sh_cartao'
    ];

    document.getElementById('data_caixa').valueAsDate = new Date();
    carregarData();

    function getVal(id) {
        return parseFloat(document.getElementById(id).value) || 0;
    }

    function setVal(id, val) {
        document.getElementById(id).value = val > 0 ? val : '';
    }

    function fmt(valor) {
        return `R$ ${valor.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
    }

    function calcular() {
        let clipp = getVal('clipp_np') + getVal('clipp_pix') + getVal('clipp_especie') + getVal('clipp_cartao');
        let os = getVal('os_np') + getVal('os_pix') + getVal('os_especie') + getVal('os_cartao');
        let sh = getVal('sh_np') + getVal('sh_pix') + getVal('sh_especie') + getVal('sh_cartao');

        document.getElementById('sub_clipp').innerText = fmt(clipp);
        document.getElementById('sub_os').innerText = fmt(os);
        document.getElementById('sub_sh').innerText = fmt(sh);

        let totNp = getVal('clipp_np') + getVal('os_np') + getVal('sh_np');
        let totPix = getVal('clipp_pix') + getVal('os_pix') + getVal('sh_pix');
        let totEspecie = getVal('clipp_especie') + getVal('os_especie') + getVal('sh_especie');
        let totCartao = getVal('clipp_cartao') + getVal('os_cartao') + getVal('sh_cartao');

        document.getElementById('tot_np').innerText = fmt(totNp);
        document.getElementById('tot_pix').innerText = fmt(totPix);
        document.getElementById('tot_especie').innerText = fmt(totEspecie);
        document.getElementById('tot_cartao').innerText = fmt(totCartao);

        let total = clipp + os + sh;
        document.getElementById('total_geral').innerText = fmt(total);
    }

    async function carregarData() {
        const dataSel = document.getElementById('data_caixa').value;
        if (!dataSel) return;

        try {
            const response = await fetch(`/api/caixa/${dataSel}`);
            const data = await response.json();

            if (data.encontrado) {
                setVal('clipp_np', data.clipp_np); setVal('clipp_pix', data.clipp_pix);
                setVal('clipp_especie', data.clipp_especie); setVal('clipp_cartao', data.clipp_cartao);

                setVal('os_np', data.osrecargas_np); setVal('os_pix', data.osrecargas_pix);
                setVal('os_especie', data.osrecargas_especie); setVal('os_cartao', data.osrecargas_cartao);

                setVal('sh_np', data.shoficina_np); setVal('sh_pix', data.shoficina_pix);
                setVal('sh_especie', data.shoficina_especie); setVal('sh_cartao', data.shoficina_cartao);
            } else {
                // Se o dia não existe no banco, zera todos os campos
                campos.forEach(id => document.getElementById(id).value = '');
            }
            calcular();
        } catch (e) {
            console.error('Erro ao carregar dados da data:', e);
        }
    }

    async function salvarData() {
        const payload = {
            data_caixa: document.getElementById('data_caixa').value,
            clipp_np: getVal('clipp_np'), clipp_pix: getVal('clipp_pix'), clipp_especie: getVal('clipp_especie'), clipp_cartao: getVal('clipp_cartao'),
            osrecargas_np: getVal('os_np'), osrecargas_pix: getVal('os_pix'), osrecargas_especie: getVal('os_especie'), osrecargas_cartao: getVal('os_cartao'),
            shoficina_np: getVal('sh_np'), shoficina_pix: getVal('sh_pix'), shoficina_especie: getVal('sh_especie'), shoficina_cartao: getVal('sh_cartao')
        };

        try {
            const response = await fetch('/api/caixa', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                alert('✅ Caixa salvo com sucesso!');
            } else {
                alert('❌ Erro ao salvar o caixa.');
            }
        } catch (e) {
            alert('⚠️ Erro de conexão com o servidor.');
        }
    }
</script>
</body>
</html>
